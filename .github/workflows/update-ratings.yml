name: Update Ratings Data

on:
  schedule:
    # Run every Sunday at 14:30 UTC (8:00 PM IST) to get new problems immediately
    - cron: '30 14 * * 0'
    # Run every Thursday at 00:00 UTC (5:30 AM IST) to get finalized official ratings
    - cron: '0 0 * * 4'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node scripts/fetch_data.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data.json
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update ratings data" && git push)
